<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Surgical Patient Flow — EDA Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:       #f5f5f5;
    --surface:  #ffffff;
    --surface2: #f0f0f0;
    --text:     #1a1a1a;
    --muted:    #666666;
    --border:   rgba(0,0,0,0.10);
    --radius:   10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:       #111111;
      --surface:  #1e1e1e;
      --surface2: #2a2a2a;
      --text:     #eeeeee;
      --muted:    #999999;
      --border:   rgba(255,255,255,0.10);
    }
  }
  body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; font-size: 14px; }
  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 28px; display:flex; align-items:center; gap:16px; position:sticky; top:0; z-index:100; }
  header h1 { font-size: 16px; font-weight: 600; }
  .tab-bar { display:flex; gap:6px; flex-wrap:wrap; }
  .tab-btn { background: none; border: 1px solid var(--border); border-radius: 6px; padding: 6px 14px;
             font-size: 13px; cursor: pointer; color: var(--muted); transition: all .15s; }
  .tab-btn:hover { background: var(--surface2); color: var(--text); }
  .tab-btn.active { background: #378ADD; color: #fff; border-color: #378ADD; }
  .tab-panel { display: none; padding: 24px 28px; }
  .tab-panel.active { display: block; }
  .section-title { font-size: 15px; font-weight: 600; margin-bottom: 16px; }
  .metric-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .metric-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .metric-card .m-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing:.04em; margin-bottom: 6px; }
  .metric-card .m-val   { font-size: 22px; font-weight: 600; }
  .metric-card .m-sub   { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .chart-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
  .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
  .chart-card .c-title { font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: 10px; }
  .chart-wrap { position: relative; width: 100%; }
  table.summary { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 24px; }
  table.summary th { text-align: left; padding: 8px 12px; background: var(--surface2);
                     border-bottom: 1px solid var(--border); font-weight: 500; }
  table.summary td { padding: 7px 12px; border-bottom: 1px solid var(--border); color: var(--muted); }
  table.summary tr:last-child td { border-bottom: none; }
</style>
</head>
<body>

const gridColor   = getComputedStyle(document.body).getPropertyValue('--border').trim()
                    || 'rgba(0,0,0,0.08)';
const labelColor  = getComputedStyle(document.body).getPropertyValue('--muted').trim()  || '#666';
const totalN      = {};

function hex2rgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function makeChart(canvasId, cfg) {
  const ctx = document.getElementById(canvasId).getContext('2d');
  const isScatter = cfg.type === 'scatter';
  const datasets = [{
    label: cfg.label,
    data:  cfg.data,
    backgroundColor: isScatter ? hex2rgba(cfg.color, 0.5) : hex2rgba(cfg.color, 0.82),
    borderColor:     cfg.color,
    borderWidth:     isScatter ? 0 : 0,
    borderRadius:    isScatter ? 0 : 4,
    pointRadius:     isScatter ? 4 : 3,
  }];

  new Chart(ctx, {
    type: cfg.type,
    data: isScatter ? { datasets } : { labels: cfg.labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      indexAxis: cfg.indexAxis || 'x',
      animation: { duration: 400 },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: (ctx) => {
              if (isScatter) return `(${ctx.raw.x}, ${ctx.raw.y})`;
              const pct = totalN[canvasId]
                ? ' (' + (ctx.raw / totalN[canvasId] * 100).toFixed(1) + '%)'
                : '';
              return `${ctx.raw}${pct}`;
            }
          }
        }
      },
      scales: {
        x: { grid: { color: gridColor }, ticks: { color: labelColor, font:{size:11}, maxTicksLimit: 8 } },
        y: { grid: { color: gridColor }, ticks: { color: labelColor, font:{size:11} } },
      }
    }
  });

  // store total for % calculation
  if (!isScatter && Array.isArray(cfg.data)) {
    totalN[canvasId] = cfg.data.reduce((a, b) => a + b, 0);
  }
}

function buildTab(tableKey, tableCfg, idx) {
  // tab button
  const btn = document.createElement('button');
  btn.className = 'tab-btn' + (idx === 0 ? ' active' : '');
  btn.textContent = tableKey.replace(/_/g, ' ');
  btn.dataset.target = tableKey;
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + tableKey).classList.add('active');
  });
  document.getElementById('tabBar').appendChild(btn);

  // panel
  const panel = document.createElement('div');
  panel.className = 'tab-panel' + (idx === 0 ? ' active' : '');
  panel.id = 'panel-' + tableKey;

  let html = `<p class="section-title">${tableCfg.title}</p>`;

  // metric cards
  if (tableCfg.metrics && tableCfg.metrics.length) {
    html += '<div class="metric-row">';
    tableCfg.metrics.forEach(m => {
      html += `
        <div class="metric-card">
          <div class="m-label">${m.label}</div>
          <div class="m-val">${m.mean}</div>
          <div class="m-sub">min ${m.min} &nbsp;|&nbsp; max ${m.max} &nbsp;|&nbsp; &sigma; ${m.std}</div>
        </div>`;
    });
    html += '</div>';
  }

  // charts
  html += '<div class="chart-grid">';
  tableCfg.charts.forEach((c, ci) => {
    const cid = `chart-${tableKey}-${ci}`;
    const nBars = Array.isArray(c.labels) ? c.labels.length : 10;
    const hbar  = c.indexAxis === 'y';
    const wrapH = hbar ? Math.max(200, nBars * 28 + 60) : 220;
    html += `
      <div class="chart-card">
        <div class="c-title">${c.label}</div>
        <div class="chart-wrap" style="height:${wrapH}px">
          <canvas id="${cid}" role="img" aria-label="${c.label} chart"></canvas>
        </div>
      </div>`;
  });
  html += '</div>';

  panel.innerHTML = html;
  document.getElementById('panels').appendChild(panel);

  // render charts after DOM insertion
  requestAnimationFrame(() => {
    tableCfg.charts.forEach((c, ci) => {
      makeChart(`chart-${tableKey}-${ci}`, c);
    });
  });
}

// boot
Object.entries(DASHBOARD).forEach(([key, cfg], idx) => buildTab(key, cfg, idx));
</script>
</body>
</html>
